<ion-tabs>

    <!-- HOME -->

      <ion-icon class="icon-outline" name="home-outline"></ion-icon>
      <ion-icon class="icon-filled" name="home"></ion-icon>

    <!-- ATTENDANCE -->
    <ion-tab-button tab="attendance" href="/tabs/attendance">
